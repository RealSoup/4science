<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <title>포사이언스 - 시스템 점검 중</title>
    <style>
        body {
            margin: 0;
            font-family: "Malgun Gothic", sans-serif;
            background: #f5f7fa;
            color: #333;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .box {
            background: #fff;
            padding: 48px 40px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 4px 20px rgba(0, 0, 0, .08);
            max-width: 480px;
            margin: 16px;
        }

        h1 {
            font-size: 24px;
            margin: 0 0 16px;
            color: #1a4fa0;
        }

        p {
            line-height: 1.7;
            margin: 8px 0;
        }

        .contact {
            margin-top: 24px;
            padding-top: 20px;
            border-top: 1px solid #eee;
            font-size: 14px;
            color: #666;
        }
    </style>
</head>

<body>
    <div class="box">
        <h1>🔧 시스템 점검 중입니다</h1>
        <p>보다 안정적인 서비스를 위해 현재 시스템 점검을 진행하고 있습니다.</p>
        <p>이용에 불편을 드려 죄송합니다.<br>빠른 시간 내에 정상화하겠습니다.</p>
    </div>
</body>

</html>
